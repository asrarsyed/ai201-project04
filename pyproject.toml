[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authentiwrite"
version = "1.0.0"
description = "Local, explainable AI-vs-human text detection with an audit log and appeal path."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "flask>=3.0,<4.0",
    "flask-limiter>=3.5,<4.0",
    "requests>=2.31,<3.0",
    "transformers>=4.44,<5.0",
    "torch>=2.2,<3.0",
    "gunicorn>=21.2,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_environment.py is an environment and dependency check you run by hand,
# not a test suite. It has no assertions, so it reports nothing useful here.
addopts = "--ignore=tests/test_environment.py"
